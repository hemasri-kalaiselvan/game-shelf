<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo Pearls</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e2a2f;--board:#173c42;--ink:#e9f3ef;--mute:#8fb3ae;--accent:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
main{width:100%;max-width:400px;padding:20px 16px 28px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:12px}
.back:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font:700 28px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.scores{display:flex;gap:8px}
.sc{background:var(--board);border-radius:10px;padding:6px 12px;text-align:center;min-width:58px}
.sc small{display:block;color:var(--mute);font-size:11px}
.sc b{font-size:18px}
#pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--board);padding:12px;border-radius:50%;aspect-ratio:1}
.p{border:0;border-radius:50%;cursor:pointer;opacity:.45;transition:opacity .1s,transform .1s}
.p.lit{opacity:1;transform:scale(1.05)}
.p:disabled{cursor:default}
#p0{background:#3fb0a6}#p1{background:#f2b84b}#p2{background:#d95d52}#p3{background:#8fd6bf}
@media (prefers-reduced-motion:reduce){.p{transition:none}}
#st{text-align:center;min-height:28px;margin:16px 0 0;font:700 20px Georgia,serif}
.row{display:flex;justify-content:center;margin-top:12px}
button.go{font:600 16px "Trebuchet MS",sans-serif;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#2a1c00;cursor:pointer}
</style>
</head>
<body>
<main>
<a class="back" href="../../">‹ All games</a>
<header><h1>Echo Pearls</h1><div class="scores"><div class="sc"><small>Round</small><b id="round">0</b></div><div class="sc"><small>Best</small><b id="best">0</b></div></div></header>
<div id="pads"></div>
<div id="st" aria-live="polite">Watch, then repeat</div>
<div class="row"><button class="go" id="go">Start</button></div>
</main>
<script>
const $=id=>document.getElementById(id),pads=[],FREQ=[262,330,392,523];
let seq=[],pos=0,accept=false,best=0,ac;
try{best=+localStorage.getItem('echo-pearls-best')||0}catch(e){}
$('best').textContent=best;
for(let i=0;i<4;i++){const b=document.createElement('button');b.className='p';b.id='p'+i;b.disabled=true;b.setAttribute('aria-label','Pearl '+(i+1));b.onpointerdown=()=>press(i);$('pads').appendChild(b);pads.push(b)}
function tone(i){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=FREQ[i];o.type='sine';g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.36)}catch(e){}}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function flash(i,ms=350){pads[i].classList.add('lit');tone(i);await wait(ms);pads[i].classList.remove('lit');await wait(120)}
async function play(){accept=false;pads.forEach(p=>p.disabled=true);$('st').textContent='Watch...';await wait(500);
const ms=Math.max(180,350-seq.length*12);for(const i of seq)await flash(i,ms);
pos=0;accept=true;pads.forEach(p=>p.disabled=false);$('st').textContent='Your turn'}
function nextRound(){seq.push(Math.random()*4|0);$('round').textContent=seq.length;play()}
async function press(i){if(!accept)return;pads[i].classList.add('lit');tone(i);setTimeout(()=>pads[i].classList.remove('lit'),180);
if(i!==seq[pos]){accept=false;pads.forEach(p=>p.disabled=true);const r=seq.length-1;$('st').textContent='Missed! You reached round '+Math.max(r,0);
if(r>best){best=r;try{localStorage.setItem('echo-pearls-best',best)}catch(e){}$('best').textContent=best}$('go').textContent='Play again';return}
pos++;if(pos===seq.length){accept=false;pads.forEach(p=>p.disabled=true);$('st').textContent='Nice!';await wait(700);nextRound()}}
$('go').onclick=()=>{seq=[];$('go').textContent='Restart';nextRound()};
</script>
</body>
</html>

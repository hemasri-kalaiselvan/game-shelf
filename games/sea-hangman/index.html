<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sea Hangman</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e2a2f;--board:#173c42;--ink:#e9f3ef;--mute:#8fb3ae;--accent:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
main{width:100%;max-width:440px;padding:16px 12px 24px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:8px}
.back:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
h1{font:700 28px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.sc{background:var(--board);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px}
.sc small{display:block;color:var(--mute);font-size:11px}
.sc b{font-size:18px}
svg{display:block;width:150px;height:170px;margin:0 auto;background:var(--board);border-radius:16px}
svg *{stroke:var(--ink);stroke-width:4;fill:none;stroke-linecap:round}
svg .part{display:none}
svg .part.on{display:inline}
#hint{text-align:center;color:var(--mute);margin:10px 0 0;font-size:14px}
#word{text-align:center;font:700 clamp(24px,8vw,34px) Georgia,serif;letter-spacing:.2em;margin:10px 0;min-height:44px;word-break:break-all}
#msg{text-align:center;min-height:26px;margin-bottom:8px;font:700 18px Georgia,serif}
#kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.k{width:calc((100% - 36px)/7);max-width:54px;height:44px;border:0;border-radius:8px;background:var(--board);color:var(--ink);font:600 16px "Trebuchet MS",sans-serif;text-transform:uppercase;cursor:pointer;padding:0}
.k.ok{background:#3fb0a6;color:#06201f}.k.no{background:#10262a;color:var(--mute)}
.k:disabled{cursor:default}
.row{display:flex;justify-content:center;margin-top:14px}
button.go{font:600 16px "Trebuchet MS",sans-serif;border:0;border-radius:12px;padding:10px 20px;background:var(--accent);color:#2a1c00;cursor:pointer}
</style>
</head>
<body>
<main>
<a class="back" href="../../">‹ All games</a>
<header><h1>Sea Hangman</h1><div class="sc"><small>Wins</small><b id="wins">0</b></div></header>
<svg viewBox="0 0 150 170" role="img" aria-label="Hangman drawing">
<path d="M20 160H100M40 160V15H100V35"/>
<circle class="part" cx="100" cy="50" r="15"/>
<path class="part" d="M100 65V105"/>
<path class="part" d="M100 75L82 92"/>
<path class="part" d="M100 75L118 92"/>
<path class="part" d="M100 105L84 135"/>
<path class="part" d="M100 105L116 135"/>
</svg>
<p id="hint"></p>
<div id="word" aria-live="polite"></div>
<div id="msg" aria-live="polite"></div>
<div id="kb"></div>
<div class="row"><button class="go" id="again">New word</button></div>
</main>
<script>
const WORDS=[["ANCHOR","Ship gear"],["LIGHTHOUSE","On the coast"],["SEAHORSE","Sea animal"],["JELLYFISH","Sea animal"],["OCTOPUS","Sea animal"],["DOLPHIN","Sea animal"],["LOBSTER","Sea animal"],["TURTLE","Sea animal"],["CORAL","Reef"],["LAGOON","Water"],["HARBOR","Where ships dock"],["COMPASS","Navigation"],["TREASURE","Pirate loot"],["SEAWEED","Ocean plant"],["SURFBOARD","Sport gear"],["SNORKEL","Swimming gear"],["PELICAN","Sea bird"],["SEAGULL","Sea bird"],["PENGUIN","Cold sea bird"],["WALRUS","Arctic animal"],["TSUNAMI","Giant wave"],["CURRENT","Moving water"],["ISLAND","Land in water"],["MERMAID","Sea myth"],["CAPTAIN","Ship leader"],["SAILBOAT","Vessel"],["SHIPWRECK","Sunken vessel"],["PLANKTON","Tiny sea life"],["CLAM","Shellfish"],["STARFISH","Sea animal"]];
const $=id=>document.getElementById(id),parts=[...document.querySelectorAll('.part')],keys={};
let w,hint,guessed,wrong,done,wins=0;
"abcdefghijklmnopqrstuvwxyz".split('').forEach(ch=>{const b=document.createElement('button');b.className='k';b.textContent=ch;b.onclick=()=>guess(ch.toUpperCase());$('kb').appendChild(b);keys[ch.toUpperCase()]=b});
function show(){$('word').textContent=[...w].map(c=>guessed.has(c)?c:'_').join(' ')}
function start(){[w,hint]=WORDS[Math.random()*WORDS.length|0];guessed=new Set();wrong=0;done=false;$('hint').textContent='Hint: '+hint;$('msg').textContent='';
parts.forEach(p=>p.classList.remove('on'));Object.values(keys).forEach(k=>{k.className='k';k.disabled=false});show()}
function guess(c){if(done||guessed.has(c))return;guessed.add(c);
if(w.includes(c)){keys[c].classList.add('ok')}else{keys[c].classList.add('no');parts[wrong].classList.add('on');wrong++}
keys[c].disabled=true;show();
if([...w].every(x=>guessed.has(x))){done=true;wins++;$('wins').textContent=wins;$('msg').textContent='You saved him!'}
else if(wrong>=6){done=true;$('msg').textContent='The word was '+w;$('word').textContent=[...w].join(' ')}}
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[a-z]$/i.test(e.key))guess(e.key.toUpperCase())});
$('again').onclick=start;
start();
</script>
</body>
</html>

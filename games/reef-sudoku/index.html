<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef Sudoku</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e2a2f;--board:#173c42;--cell:#1f4a51;--ink:#e9f3ef;--mute:#8fb3ae;--accent:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
main{width:100%;max-width:440px;padding:16px 10px 24px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:8px}
.back:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
h1{font:700 28px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.sc{background:var(--board);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px}
.sc small{display:block;color:var(--mute);font-size:11px}
.sc b{font-size:18px}
#grid{display:grid;grid-template-columns:repeat(9,1fr);background:var(--board);padding:4px;border-radius:12px;gap:1px}
.c{aspect-ratio:1;border:0;border-radius:3px;background:var(--cell);color:#8fd6bf;font:600 clamp(16px,5.6vw,24px) Georgia,serif;padding:0;cursor:pointer}
.c.fx{color:var(--ink);font-weight:700}
.c.same{background:#2c6a6a}
.c.sel{background:#f2b84b;color:#2a1c00}
.c.err{color:#ff8a7a}
.c.r2{margin-bottom:3px}.c.c2{margin-right:3px}.c.r5{margin-bottom:3px}.c.c5{margin-right:3px}
#pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.n{height:46px;border:0;border-radius:10px;background:var(--board);color:var(--ink);font:600 20px Georgia,serif;cursor:pointer}
#st{text-align:center;min-height:26px;margin:10px 0 0;font:700 18px Georgia,serif}
.row{display:flex;justify-content:center;gap:10px;margin-top:10px}
button.go{font:600 16px "Trebuchet MS",sans-serif;border:0;border-radius:12px;padding:10px 18px;background:var(--accent);color:#2a1c00;cursor:pointer}
button.alt{background:var(--board);color:var(--ink)}
</style>
</head>
<body>
<main>
<a class="back" href="../../">‹ All games</a>
<header><h1>Reef Sudoku</h1><div class="sc"><small>Time</small><b id="time">0:00</b></div></header>
<div id="grid"></div>
<div id="pad"></div>
<div id="st" aria-live="polite"></div>
<div class="row"><button class="go" id="again">New puzzle</button><button class="go alt" id="lvl">Level: Easy</button></div>
</main>
<script>
const $=id=>document.getElementById(id),grid=$('grid'),cells=[];
let sol,cur,fx,sel=-1,hard=false,secs=0,timer,done;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function cands(g,i){const r=i/9|0,c=i%9,u=new Set();for(let k=0;k<9;k++){u.add(g[r*9+k]);u.add(g[k*9+c])}const br=r-r%3,bc=c-c%3;for(let a=0;a<3;a++)for(let b=0;b<3;b++)u.add(g[(br+a)*9+bc+b]);const o=[];for(let v=1;v<=9;v++)if(!u.has(v))o.push(v);return o}
function cnt(g,lim){let bi=-1,bc=null;for(let i=0;i<81;i++){if(g[i])continue;const c=cands(g,i);if(!c.length)return 0;if(!bc||c.length<bc.length){bc=c;bi=i;if(c.length===1)break}}
if(bi<0)return 1;let n=0;for(const v of bc){g[bi]=v;n+=cnt(g,lim-n);if(n>=lim)break}g[bi]=0;return n}
function full(){const g=[0,1,2],rows=shuf(g).flatMap(b=>shuf(g).map(r=>b*3+r)),cols=shuf(g).flatMap(b=>shuf(g).map(c=>b*3+c)),d=shuf([1,2,3,4,5,6,7,8,9]),s=[];
for(const r of rows)for(const c of cols)s.push(d[(3*(r%3)+(r/3|0)+c)%9]);return s}
function make(){sol=full();const p=sol.slice(),target=hard?52:42;let h=0;
for(const i of shuf([...Array(81).keys()])){if(h>=target)break;const s=p[i];p[i]=0;if(cnt(p.slice(),2)!==1)p[i]=s;else h++}return p}
for(let i=0;i<81;i++){const b=document.createElement('button');const r=i/9|0,c=i%9;b.className='c'+(r%3===2&&r<8?' r2':'')+(c%3===2&&c<8?' c2':'');b.onclick=()=>{sel=i;paint()};grid.appendChild(b);cells.push(b)}
const pad=$('pad');for(let v=1;v<=9;v++){const b=document.createElement('button');b.className='n';b.textContent=v;b.onclick=()=>put(v);pad.appendChild(b)}
const er=document.createElement('button');er.className='n';er.textContent='⌫';er.setAttribute('aria-label','Erase');er.onclick=()=>put(0);pad.appendChild(er);
function paint(){cells.forEach((b,i)=>{const v=cur[i];b.textContent=v||'';let k=b.className.split(' ').filter(x=>/^[rc]\d$/.test(x)).join(' ');
if(fx[i])k+=' fx';if(i===sel)k+=' sel';else if(sel>=0&&cur[sel]&&v===cur[sel])k+=' same';if(v&&!fx[i]&&v!==sol[i])k+=' err';b.className='c '+k})}
function put(v){if(done||sel<0||fx[sel])return;cur[sel]=v;paint();if(cur.every((x,i)=>x===sol[i])){done=true;clearInterval(timer);$('st').textContent='Solved in '+fmt(secs)+'!'}}
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
function start(){$('st').textContent='Making puzzle...';setTimeout(()=>{const p=make();cur=p.slice();fx=p.map(Boolean);sel=-1;done=false;secs=0;$('time').textContent='0:00';$('st').textContent='';paint();
clearInterval(timer);timer=setInterval(()=>{secs++;$('time').textContent=fmt(secs)},1000)},30)}
addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))put(+e.key);else if(e.key==='Backspace'||e.key==='0')put(0);else if(sel>=0){const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-9,ArrowDown:9}[e.key];if(m&&sel+m>=0&&sel+m<81){sel+=m;paint()}}});
$('again').onclick=start;
$('lvl').onclick=e=>{hard=!hard;e.target.textContent='Level: '+(hard?'Medium':'Easy');start()};
start();
</script>
</body>
</html>

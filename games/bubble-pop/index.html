<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bubble Pop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e2a2f;--board:#173c42;--ink:#e9f3ef;--mute:#8fb3ae;--accent:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
main{width:100%;max-width:440px;padding:20px 16px 28px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:12px}
.back:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font:700 28px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.scores{display:flex;gap:8px}
.sc{background:var(--board);border-radius:10px;padding:6px 12px;text-align:center;min-width:58px}
.sc small{display:block;color:var(--mute);font-size:11px}
.sc b{font-size:18px}
#area{position:relative;background:var(--board);border-radius:16px;aspect-ratio:1;overflow:hidden}
.b{position:absolute;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 32% 30%,#e9f3ef 0,#8fd6bf 35%,#3fb0a6 100%);cursor:pointer;animation:grow .15s ease-out}
.b.gold{background:radial-gradient(circle at 32% 30%,#fff3cf 0,#f2b84b 40%,#e57a3a 100%)}
@keyframes grow{from{transform:scale(.3)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.b{animation:none}}
#ov{position:absolute;inset:0;background:rgba(14,42,47,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:700 24px Georgia,serif;text-align:center;padding:16px;z-index:5}
#ov small{font:400 14px "Trebuchet MS",sans-serif;color:var(--mute)}
button.go{font:600 16px "Trebuchet MS",sans-serif;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#2a1c00;cursor:pointer}
</style>
</head>
<body>
<main>
<a class="back" href="../../">‹ All games</a>
<header>
<h1>Bubble Pop</h1>
<div class="scores"><div class="sc"><small>Time</small><b id="time">30</b></div><div class="sc"><small>Score</small><b id="score">0</b></div><div class="sc"><small>Best</small><b id="best">0</b></div></div>
</header>
<div id="area"><div id="ov"><span id="msg">Bubble Pop</span><small id="sm">Pop as many bubbles as you can in 30 seconds. Gold bubbles are worth 3.</small><button class="go" id="go">Start</button></div></div>
<script>
const $=id=>document.getElementById(id),area=$('area');
let score=0,t=30,best=0,spawn,clock,running=false;
try{best=+localStorage.getItem('bubble-pop-best')||0}catch(e){}
$('best').textContent=best;
function add(){
if(!running)return;
const size=Math.max(40,70-(30-t)*.8),gold=Math.random()<.15,life=Math.max(700,1500-(30-t)*25);
const w=area.clientWidth,h=area.clientHeight,b=document.createElement('button');
b.className='b'+(gold?' gold':'');b.setAttribute('aria-label','Pop bubble');
b.style.width=b.style.height=size+'px';b.style.left=Math.random()*(w-size)+'px';b.style.top=Math.random()*(h-size)+'px';
b.onpointerdown=e=>{e.preventDefault();score+=gold?3:1;$('score').textContent=score;b.remove()};
area.appendChild(b);setTimeout(()=>b.remove(),life)}
function loop(){clearTimeout(spawn);add();spawn=setTimeout(loop,Math.max(280,650-(30-t)*12))}
function start(){score=0;t=30;running=true;$('score').textContent=0;$('time').textContent=t;$('ov').style.display='none';
area.querySelectorAll('.b').forEach(b=>b.remove());loop();
clock=setInterval(()=>{t--;$('time').textContent=t;if(t<=0)end()},1000)}
function end(){running=false;clearInterval(clock);clearTimeout(spawn);area.querySelectorAll('.b').forEach(b=>b.remove());
if(score>best){best=score;try{localStorage.setItem('bubble-pop-best',best)}catch(e){}$('best').textContent=best}
$('msg').textContent='Time up!';$('sm').textContent='You popped '+score+' points';$('go').textContent='Play again';$('ov').style.display='flex'}
$('go').onclick=start;
</script>
</main>
</body>
</html>

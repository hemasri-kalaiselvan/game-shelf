<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reef Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e2a2f;--board:#173c42;--ink:#e9f3ef;--mute:#8fb3ae;--accent:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;touch-action:none}
main{width:100%;max-width:440px;padding:20px 16px 28px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:12px}
.back:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font:700 28px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.scores{display:flex;gap:8px}
.sc{background:var(--board);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px}
.sc small{display:block;color:var(--mute);font-size:11px}
.sc b{font-size:18px}
.wrap{position:relative}
canvas{display:block;width:100%;aspect-ratio:1;background:var(--board);border-radius:16px}
#ov{position:absolute;inset:0;border-radius:16px;background:rgba(14,42,47,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:700 24px Georgia,serif;text-align:center;padding:16px}
#ov small{font:400 14px "Trebuchet MS",sans-serif;color:var(--mute)}
button{font:600 16px "Trebuchet MS",sans-serif;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#2a1c00;cursor:pointer}
</style>
</head>
<body>
<main>
<a class="back" href="../../">‹ All games</a>
<header>
<h1>Reef Snake</h1>
<div class="scores"><div class="sc"><small>Score</small><b id="score">0</b></div><div class="sc"><small>Best</small><b id="best">0</b></div></div>
</header>
<div class="wrap">
<canvas id="c" width="400" height="400" aria-label="Snake board"></canvas>
<div id="ov"><span id="msg">Reef Snake</span><small id="sm">Swipe or use arrow keys to steer</small><button id="go">Start</button></div>
</div>
</main>
<script>
const N=20,S=400/N,cv=document.getElementById('c'),x=cv.getContext('2d');
let snake,dir,next,food,score,best=0,timer,speed;
try{best=+localStorage.getItem('reef-snake-best')||0}catch(e){}
const $=id=>document.getElementById(id);
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=next={x:1,y:0};score=0;speed=140;place();$('ov').style.display='none';upd();draw();clearInterval(timer);timer=setInterval(tick,speed)}
function upd(){$('score').textContent=score;if(score>best){best=score;try{localStorage.setItem('reef-snake-best',best)}catch(e){}}$('best').textContent=best}
function tick(){
dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y))return over();
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){score++;upd();place();if(speed>70){speed-=4;clearInterval(timer);timer=setInterval(tick,speed)}}else snake.pop();
draw()}
function over(){clearInterval(timer);$('msg').textContent='Game over';$('sm').textContent='Score: '+score;$('go').textContent='Play again';$('ov').style.display='flex'}
function draw(){
x.clearRect(0,0,400,400);
x.fillStyle='#f2b84b';x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.35,0,7);x.fill();
snake.forEach((s,i)=>{x.fillStyle=i?'#3fb0a6':'#8fd6bf';x.beginPath();x.roundRect(s.x*S+1.5,s.y*S+1.5,S-3,S-3,5);x.fill()})}
function steer(dx,dy){if(dx===-dir.x&&dy===-dir.y)return;next={x:dx,y:dy}}
addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();steer(...m)}});
let sx,sy;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(sx==null)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;sx=null;Math.abs(dx)>Math.abs(dy)?steer(dx<0?-1:1,0):steer(0,dy<0?-1:1)},{passive:true});
$('go').onclick=start;
snake=[{x:10,y:10}];food={x:15,y:10};upd();draw();
</script>
</body>
</html>

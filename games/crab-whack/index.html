<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crab Whack</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0e2a2f;--board:#173c42;--hole:#0a1d20;--ink:#e9f3ef;--mute:#8fb3ae;--accent:#f2b84b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
main{width:100%;max-width:440px;padding:20px 16px 28px}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:14px;margin-bottom:12px}
.back:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
h1{font:700 28px/1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.5px}
.scores{display:flex;gap:8px}
.sc{background:var(--board);border-radius:10px;padding:6px 12px;text-align:center;min-width:56px}
.sc small{display:block;color:var(--mute);font-size:11px}
.sc b{font-size:18px}
.wrap{position:relative}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--board);padding:12px;border-radius:16px}
.h{aspect-ratio:1;border:0;border-radius:50%;background:var(--hole);font-size:clamp(34px,13vw,56px);cursor:pointer;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
.h span{transform:translateY(120%);transition:transform .1s;display:block}
.h.up span{transform:translateY(0)}
.h.hit{background:#3fb0a6}
.h.hit span{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.h span{transition:none}}
#ov{position:absolute;inset:0;border-radius:16px;background:rgba(14,42,47,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:700 24px Georgia,serif;text-align:center;padding:16px}
#ov small{font:400 14px "Trebuchet MS",sans-serif;color:var(--mute)}
button.go{font:600 16px "Trebuchet MS",sans-serif;border:0;border-radius:12px;padding:12px 22px;background:var(--accent);color:#2a1c00;cursor:pointer}
</style>
</head>
<body>
<main>
<a class="back" href="../../">‹ All games</a>
<header><h1>Crab Whack</h1><div class="scores"><div class="sc"><small>Time</small><b id="time">30</b></div><div class="sc"><small>Score</small><b id="score">0</b></div><div class="sc"><small>Best</small><b id="best">0</b></div></div></header>
<div class="wrap"><div id="grid"></div>
<div id="ov"><span id="msg">Crab Whack</span><small id="sm">Tap the crabs. Avoid the jellyfish (-2).</small><button class="go" id="go">Start</button></div></div>
</main>
<script>
const $=id=>document.getElementById(id),holes=[];
let score,t,best=0,clock,running,timers=[];
try{best=+localStorage.getItem('crab-whack-best')||0}catch(e){}
$('best').textContent=best;
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='h';b.innerHTML='<span></span>';b.setAttribute('aria-label','Hole '+(i+1));b.onpointerdown=e=>{e.preventDefault();whack(i)};$('grid').appendChild(b);holes.push({el:b,kind:null,timer:null})}
function hide(i){const h=holes[i];clearTimeout(h.timer);h.kind=null;h.el.classList.remove('up','hit')}
function popup(){if(!running)return;
const free=holes.map((h,i)=>h.kind?-1:i).filter(i=>i>=0);
if(free.length){const i=free[Math.random()*free.length|0],h=holes[i],jelly=Math.random()<.2;h.kind=jelly?'j':'c';h.el.firstChild.textContent=jelly?'🪼':'🦀';h.el.classList.add('up');
h.timer=setTimeout(()=>hide(i),Math.max(450,950-(30-t)*14))}
setTimeout(popup,Math.max(280,700-(30-t)*12))}
function whack(i){if(!running)return;const h=holes[i];if(!h.kind)return;
score+=h.kind==='c'?1:-2;if(score<0)score=0;$('score').textContent=score;
clearTimeout(h.timer);h.el.classList.add('hit');h.kind=null;setTimeout(()=>h.el.classList.remove('up','hit'),160)}
function start(){score=0;t=30;running=true;$('score').textContent=0;$('time').textContent=30;$('ov').style.display='none';holes.forEach((_,i)=>hide(i));popup();
clock=setInterval(()=>{t--;$('time').textContent=t;if(t<=0)end()},1000)}
function end(){running=false;clearInterval(clock);holes.forEach((_,i)=>hide(i));
if(score>best){best=score;try{localStorage.setItem('crab-whack-best',best)}catch(e){}$('best').textContent=best}
$('msg').textContent='Time up!';$('sm').textContent='You scored '+score;$('go').textContent='Play again';$('ov').style.display='flex'}
$('go').onclick=start;
</script>
</body>
</html>
